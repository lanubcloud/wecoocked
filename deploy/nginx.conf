# Proxy inverso para Wecoocked. Copiar a /etc/nginx/sites-available/wecoocked
# y enlazar en sites-enabled. Despues:  sudo certbot --nginx -d tu-dominio.com
#
# El chat de voz NO funciona sin HTTPS: getUserMedia solo se permite en origenes
# seguros (o en localhost).

server {
    listen 80;
    server_name tu-dominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tu-dominio.com;

    ssl_certificate     /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;

    # Permisos que el juego necesita en el movil
    add_header Permissions-Policy "microphone=(self), screen-wake-lock=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Imprescindible para los WebSockets de Socket.IO
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La partida dura 3 min y la conexion queda abierta todo el rato
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_buffering     off;
    }
}
